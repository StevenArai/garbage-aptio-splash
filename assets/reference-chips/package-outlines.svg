<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470">
  <title>SPI flash package outlines</title>
  <desc>Original diagram for SPI flash package identification. CC0 1.0. Not to scale.</desc>
  <rect width="1200" height="470" fill="#ffffff"/>
  <text x="40" y="52" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#111111">SPI flash package outlines</text>
  <text x="40" y="82" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#444444">Use the shape only. Packages are not to scale.</text>

  <g stroke="#111111" stroke-width="4" fill="#f7f7f7">
    <g transform="translate(50,130)">
      <rect x="55" y="45" width="130" height="95" rx="4"/>
      <g stroke-width="10">
        <line x1="20" y1="60" x2="55" y2="60"/>
        <line x1="20" y1="82" x2="55" y2="82"/>
        <line x1="20" y1="104" x2="55" y2="104"/>
        <line x1="20" y1="126" x2="55" y2="126"/>
        <line x1="185" y1="60" x2="220" y2="60"/>
        <line x1="185" y1="82" x2="220" y2="82"/>
        <line x1="185" y1="104" x2="220" y2="104"/>
        <line x1="185" y1="126" x2="220" y2="126"/>
      </g>
      <circle cx="72" cy="62" r="7" fill="#e08a00" stroke="none"/>
      <text x="120" y="175" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111" stroke="none">SOP8 / SOIC8</text>
      <text x="120" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#555555" stroke="none">1.27 mm pitch, 8 pins</text>
    </g>

    <g transform="translate(280,130)">
      <rect x="65" y="45" width="110" height="95" rx="4"/>
      <g stroke-width="8">
        <line x1="30" y1="60" x2="65" y2="60"/>
        <line x1="30" y1="82" x2="65" y2="82"/>
        <line x1="30" y1="104" x2="65" y2="104"/>
        <line x1="30" y1="126" x2="65" y2="126"/>
        <line x1="175" y1="60" x2="210" y2="60"/>
        <line x1="175" y1="82" x2="210" y2="82"/>
        <line x1="175" y1="104" x2="210" y2="104"/>
        <line x1="175" y1="126" x2="210" y2="126"/>
      </g>
      <circle cx="82" cy="62" r="7" fill="#e08a00" stroke="none"/>
      <text x="120" y="175" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111" stroke="none">SSOP8 / TSSOP8</text>
      <text x="120" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#555555" stroke="none">0.65 mm pitch, 8 pins</text>
    </g>

    <g transform="translate(510,130)">
      <rect x="55" y="35" width="130" height="115" rx="6"/>
      <g fill="#d9d9d9" stroke-width="2">
        <rect x="68" y="55" width="18" height="10" rx="2"/>
        <rect x="68" y="78" width="18" height="10" rx="2"/>
        <rect x="68" y="101" width="18" height="10" rx="2"/>
        <rect x="68" y="124" width="18" height="10" rx="2"/>
        <rect x="154" y="55" width="18" height="10" rx="2"/>
        <rect x="154" y="78" width="18" height="10" rx="2"/>
        <rect x="154" y="101" width="18" height="10" rx="2"/>
        <rect x="154" y="124" width="18" height="10" rx="2"/>
      </g>
      <circle cx="72" cy="52" r="7" fill="#e08a00" stroke="none"/>
      <text x="120" y="175" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111" stroke="none">WSON8 / DFN8</text>
      <text x="120" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#555555" stroke="none">pads under the body</text>
    </g>

    <g transform="translate(740,130)">
      <rect x="70" y="50" width="100" height="85" rx="6"/>
      <g fill="#d9d9d9" stroke-width="2">
        <rect x="82" y="66" width="14" height="8" rx="2"/>
        <rect x="82" y="84" width="14" height="8" rx="2"/>
        <rect x="82" y="102" width="14" height="8" rx="2"/>
        <rect x="82" y="120" width="14" height="8" rx="2"/>
        <rect x="144" y="66" width="14" height="8" rx="2"/>
        <rect x="144" y="84" width="14" height="8" rx="2"/>
        <rect x="144" y="102" width="14" height="8" rx="2"/>
        <rect x="144" y="120" width="14" height="8" rx="2"/>
      </g>
      <circle cx="86" cy="65" r="6" fill="#e08a00" stroke="none"/>
      <text x="120" y="175" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111" stroke="none">USON8</text>
      <text x="120" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#555555" stroke="none">small pads, 2 x 2 mm</text>
    </g>

    <g transform="translate(970,130)">
      <rect x="55" y="30" width="130" height="125" rx="4"/>
      <g stroke-width="9">
        <line x1="30" y1="45" x2="55" y2="45"/>
        <line x1="30" y1="70" x2="55" y2="70"/>
        <line x1="30" y1="95" x2="55" y2="95"/>
        <line x1="30" y1="120" x2="55" y2="120"/>
        <line x1="30" y1="145" x2="55" y2="145"/>
        <line x1="185" y1="45" x2="210" y2="45"/>
        <line x1="185" y1="70" x2="210" y2="70"/>
        <line x1="185" y1="95" x2="210" y2="95"/>
        <line x1="185" y1="120" x2="210" y2="120"/>
        <line x1="185" y1="145" x2="210" y2="145"/>
      </g>
      <circle cx="72" cy="48" r="7" fill="#e08a00" stroke="none"/>
      <text x="120" y="185" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111" stroke="none">SOP16</text>
      <text x="120" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#555555" stroke="none">some 16-pin SPI parts</text>
    </g>
  </g>

  <text x="50" y="400" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#333333">Pin 1 is the orange dot. Look near the PCH, the crystal, and the CMOS battery.</text>
  <text x="50" y="430" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#666666">Original work, CC0 1.0. No warranty. Use the package outline only, not the scale.</text>
</svg>
